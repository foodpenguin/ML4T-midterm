# Setup v2 registration (2026-10-27). Committed before any v2 backtest was run.
# Mechanics change, not a parameter change: results are NOT comparable with v1 as confirmatory
# evidence. Motivation and its hindsight status: ledger/decisions.md (2026-10-27).
setup_version: v2
parent: v1 (setup.yaml, frozen; holdout used once by v1, never by v2)
registered_utc: "2026-10-27"

unchanged_from_v1: >
  Universe, decision clock, labels, features, the deployed model (ridge), the 7-tranche
  mapping, allocator (equal weight), costs, vol-target and kill-switch definitions.

signal: >
  Dev exploration: the W4 out-of-fold ridge predictions (artifacts/predictions/ridge.parquet).
  Shadow test: the frozen final ridge of the holdout run (fit on all dev rows, alpha 1e5),
  stored in config/frozen_ridge.json and applied unchanged to each new decision date.

variants:
  v2a_liquidation_cap:            # PRIMARY
    role: primary
    rule: >
      Each short position behaves like a 1x isolated-margin perpetual short. If a day's high
      reaches entry x (1 + 0.90), the position is liquidated during that day at exactly that
      price. Its loss is capped near the posted margin (90% of its notional, plus fees). It stays
      flat until its tranche is rebuilt.
    liquidation_threshold: 0.90   # +90% from entry (1x margin less a maintenance buffer)
    liquidation_fee: 0.005        # 0.5% of notional at liquidation (exchange clearance fee)
    free_parameters: 0            # both values are set by exchange mechanics, not tuned
  v2b_cap_plus_short_eligibility:
    role: secondary (exploratory only)
    rule: >
      v2a, plus names in the top cross-sectional tercile of rvol_20d (t-1) on the decision date
      are not eligible for the short leg. The short leg is the lowest-score 20% of all names
      taken from the eligible ones; the long leg is unchanged.
    free_parameters: 1            # the tercile cut, fixed at 2/3 here and never tuned

trials: 2                         # ledger family F9_setup_v2

dev_exploration:
  window: "2023-03-01 .. 2025-10-24 (dev out-of-fold period)"
  status: >
    exploratory only. The dev period, including the squeeze days that motivated v2, has already
    been seen, so dev results cannot confirm v2. They show whether the mechanics work as designed.
  report: [net Sharpe with 95% CI, max drawdown, CVaR95, worst days with their driver,
           number of liquidations, effect on 2025-04-30 and 2025-09-07/08]
  models: {primary: ridge, reference: [rule_carry]}

holdout: "not used by v2 (already used once by v1)"

shadow_test:
  data: "decision dates from 2026-10-25 on, after the snapshot is extended (tools/daily_update.py,
         then scripts/build_dataset.py with a later snapshot_end_exclusive)"
  predictions: "frozen ridge (config/frozen_ridge.json), no refitting"
  minimum_length_days: 90         # no conclusion is drawn from fewer realized days
  primary_test: >
    Daily return difference v2a - v1 (ridge, equal weight, same costs): mean with a Newey-West
    95% CI (lags >= 7). v2a is supported if the CI lower bound > 0, or if the CI includes 0 while
    v2a's CVaR95 and max drawdown are both lower than v1's (tail improvement without a
    detectable return cost).
  secondary: "the same comparison for v2b; net Sharpe of each with 95% CI"
  power_note: >
    About 90-180 days gives a Sharpe standard error near +/-1.5 to 2. The shadow test can show
    a tail effect on squeeze days, but it cannot establish a return edge.

amendments:   # made after the dev exploration's code review, before any shadow data existed
  - date: "2026-10-27"
    change: v2b_cap_plus_short_eligibility - names with unknown rvol_20d are not eligible
    reason: >
      The rule did not say what happens to a name with no observed rvol_20d (new listings,
      sparse history). The first implementation treated it as eligible, and the engine's cost
      input filled it with a calm default of 0.05, so exactly the names v2b means to keep out of
      the short leg could enter it. Clarified: a name with no observed rvol_20d (forward-filled
      within the name only) is not eligible for the short leg, and the tercile cut is taken over
      the names with a known value. A rule clarification, not a tuned parameter; no trial added.
  - date: "2026-10-27"
    change: accounting bug fixes in the engine (no change to the registered mechanics)
    reason: >
      Code review of the v2 commits found that a liquidation was not counted as turnover, that a
      liquidated position still earned the full day's funding, that the liquidation count was per
      tranche position rather than per name, and that the shadow day count used calendar days.
      Fixed: a liquidation counts as turnover; a liquidated position earns no funding on its
      liquidation day; `liquidations` counts names (tranche positions are reported separately);
      realized shadow days are days whose decision date has frozen predictions for enough names
      to trade. The dev exploration was rerun as a bug-fix rerun (run_log notes), not as a trial.

monte_carlo:   # registered 2026-10-27 before any simulation; DESCRIPTIVE robustness only
  status: >
    Not a trial and not evidence that v2 works: every simulated scenario is an assumption.
    Nothing here changes a v2 parameter (the liquidation threshold, fee and tercile stay as
    registered), and the shadow test stays the only registered test of v2. The scenario
    ranges below were anchored on dev-period spike counts measured before registration (short
    leg: about 7 days/yr with day high >= 2x the open, 4/yr >= 2.5x, 1/yr >= 4x; median
    next-open retention about 0.7), so they share the dev period's hindsight.
  comparison: v1 vs v2a (primary); ridge out-of-fold scores, equal weight, W5 costs, dev window
  A_squeeze_injection:
    what: >
      Keep the real dev prices, funding and ridge scores. Add synthetic one-day squeezes to
      names that are short in some open tranche (the lowest 20% of scores on one of the last 7
      decision dates). At an event (t, name), the day high becomes max(high, open x peak), and
      every later price of that name is multiplied by 1 + retention x (peak - 1). The same
      events are used for v1 and v2a (paired), and events are nested across rates (common
      random numbers).
    grid:
      events_per_year: [2, 8, 24]       # added to the real path
      peak: [1.5, 2.5, 4.0]             # day high / day open
      retention: [0.0, 0.5, 1.0]        # 0 = spike fully reverts by the next open (v2a's worst case)
    simulations_per_cell: 200
    seed: 20261027
    report: [share of simulations where v2a's net Sharpe beats v1, mean Sharpe difference,
             mean max-drawdown difference, mean CVaR95 difference, share where both of v2a's
             tail measures are lower]
  B_paired_block_bootstrap:
    what: >
      Stationary bootstrap (mean block 20 days) of the realized paired daily returns of v1 and
      v2a on dev. Gives distributions of the Sharpe, max-drawdown and CVaR95 differences. Also
      draws 90- and 180-day paths and applies the registered shadow rule to each: the share of
      paths where v2a is "supported" (the rule's hit rate if the dev period repeated).
    replications: 2000
    path_lengths_days: [969, 90, 180]
    seed: 20261027
  C_ex_squeeze_days:
    what: >
      v1 vs v2a with the three squeeze days of W5 (2025-04-30, 2025-09-07, 2025-09-08) removed
      from both daily series: the cost of v2a on ordinary days.
  limitations: >
    Single-day shocks only (no multi-day squeeze, no funding spike, no liquidity gap); injected
    events are independent of the scores, while real squeezes concentrate in the most crowded
    shorts.
